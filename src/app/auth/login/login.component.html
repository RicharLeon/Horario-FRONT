<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-md w-full px-8 py-24 bg-white shadow-md rounded-3xl">
        <h2 class="text-2xl font-semibold mb-7 text-center">Iniciar sesión</h2>
        <form [formGroup]="form">
            <div class="mb-4">
                
                <input type="email" formControlName="email" id="email" name="email" placeholder="Correo electrónico" class="input-basic shadow-sm">
                <label class="text-red-500 text-base mt-1 " *ngIf="getError(form.get('email'))">
                    {{
                        getError(form.get('email'))
                    }}
                </label>
            </div>
            <div class="mb-6">
                
                <input type="password" id="password" name="password" placeholder="Contraseña" class="input-basic shadow-sm">
            </div>
            <button type="submit" class="button w-3/5 mx-auto mt-auto">Iniciar sesión</button>
        </form>
        <div class="mt-3 text-center">
            <a href="#" class="text-cyan-500 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</div>
