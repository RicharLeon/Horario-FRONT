<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="max-w-md w-full px-8 py-24 bg-white shadow-md rounded-3xl">
        <h2 class="text-2xl font-semibold mb-7 text-center">Iniciar sesión</h2>
        <mat-icon>tune</mat-icon>
        <form [formGroup]="loginForm" (ngSubmit)="postLoginUser()">
            
            <div class="mb-4">
                <input type="name" formControlName="username" placeholder="Usuario"
                class="input-basic shadow-sm">

                

                <label class="text-red-600 text-base mt-1 " *ngIf="getErrorUsername(loginForm.get('username'))">
                    {{
                    getErrorUsername(loginForm.get('username'))
                    }}
                </label>
            </div>
            <div class="mb-6">

                <input type="password" id="password" name="password" placeholder="Contraseña"
                    class="input-basic shadow-sm" formControlName="password" >

                    <label class="text-red-600 text-base mt-1 " *ngIf="getErrorPassword(loginForm.get('password'))">
                        {{
                            getErrorPassword(loginForm.get('password'))
                        }}
                    </label>
            </div>
            <button type="submit" [ngClass]="{'button w-3/5 mx-auto mt-auto': true, 'button-disabled': loginForm.invalid}" >Iniciar sesión</button>
        </form>
        <div class="mt-3 text-center">
            <a href="#" class="text-cyan-500 hover:underline">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</div>
