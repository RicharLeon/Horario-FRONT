<app-header>
</app-header>
<div class="container mx-auto mt-16 mb-16 overflow-x-auto ">
    
    <h2 class="text-2xl font-bold mb-4">Reportes Empleados</h2>
    <table class="min-w-full divide-y divide-gray-200">
        <thead>
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Nombre</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Nombre del Area</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Nombre del Proyecto</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Asistencia</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Fecha de la Asistencia</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Acciones</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let reporte of todosLosReportes">
                <td class="px-6 py-4 whitespace-nowrap">{{ reporte.nombre }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ reporte.nombreArea }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ reporte.nombreProyecto }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ reporte.asistencia }}</td>
                <td class="px-6 py-4 whitespace-nowrap">{{ reporte.fechaAsistencia }}</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <button class="button py-2 px-4" (click)="mostrarDetalleReporte(reporte)">
                        Ver detalle
                    </button>
                </td>
            </tr>
            <!-- Más filas aquí -->
        </tbody>
    </table>

    <app-spinner *ngIf="descargaEstaEnProceso" class="fixed top-0 left-0 w-screen h-screen flex justify-center items-center bg-black bg-opacity-50 z-50"></app-spinner>

    <div class="flex">
        <button class="button mt-2 mr-3" (click)="downloadAllReports()" [disabled]="descargaEstaEnProceso">
            <span>Descargar Excel</span>
        </button>
        
        <button class="button mt-2" (click)="downloadAllReportsPdf()" [disabled]="descargaEstaEnProceso">
            Descargar PDF
        </button>
    </div>


</div>


<app-footer></app-footer>
