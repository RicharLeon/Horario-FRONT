<app-header>
</app-header>

<div class="container mx-auto mt-16 mb-16 overflow-hidden ">
    <h2 class="text-2xl font-bold mb-4">Reportes por Empleado</h2>
    <table class="min-w-full divide-y divide-gray-200">
        <thead>
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Nombre</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Departamento</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Horas Trabajadas</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                    Acciones</th> <!-- Nueva columna para los botones -->
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
            <tr>
                <td class="px-6 py-4 whitespace-nowrap">John Doe</td>
                <td class="px-6 py-4 whitespace-nowrap">Ventas</td>
                <td class="px-6 py-4 whitespace-nowrap">40</td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <button class="button py-2 px-4">
                        Ver detalle
                    </button>
                </td>
            </tr>
            <!-- Más filas aquí -->
        </tbody>
    </table>


    <div *ngIf="!esAdministrador" class="flex">
        <button class="button mt-2 mr-3">
            Descargar Excel
        </button>
        <button class="button mt-2">
            Descargar PDF
        </button>
    </div>


</div>


<app-footer></app-footer>
